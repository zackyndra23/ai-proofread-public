name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch to keep CI image small (NER inference is not exercised in unit tests)
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements_base.txt -r requirements_test.txt
          pip install -r requirement_aiproofread.txt

      - name: Run tests
        env:
          DB_DISABLED: "1"
          STORE_DB: "0"
          MASKING_RESULTS_FEATURE: "OFF"
          USE_GPU: "0"
        run: pytest --no-cov

      - name: Run tests with coverage
        env:
          DB_DISABLED: "1"
          STORE_DB: "0"
          MASKING_RESULTS_FEATURE: "OFF"
          USE_GPU: "0"
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
